# Production deployments are manual by design: this workflow has no push or
# pull-request triggers. Press "Run workflow" in the repository's Actions tab
# to run lint and the test suite, apply pending database migrations, build
# the app, and deploy the main branch.
name: Deploy to Production

run-name: Deploy main to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Test and deploy main to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deploy the current main branch even when the workflow is dispatched
      # while another branch is selected in the "Use workflow from" menu.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Apply pending database migrations
        run: npx --no-install supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --yes

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Secret-type variables are write-only, and `vercel pull` writes a
      # [SENSITIVE] placeholder for them; values baked into the build must be
      # Config-type in the Vercel project.
      - name: Verify build-time variables are readable
        run: |
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if grep -qE "^${key}=.*\[SENSITIVE\]" .vercel/.env.production.local; then
              echo "::error::$key is Secret-type in Vercel, so vercel pull cannot read its value. Recreate it as a Config-type variable, then deploy again."
              exit 1
            fi
          done

      - name: Build production artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy artifacts to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
