# Production deployments are manual by design: this workflow has no push or
# pull-request triggers. Press "Run workflow" in the repository's Actions tab
# to run lint and the test suite, apply pending database migrations, and
# deploy the main branch (Vercel performs the build).
name: Deploy to Production

run-name: Deploy main to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Test and deploy main to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deploy the current main branch even when the workflow is dispatched
      # while another branch is selected in the "Use workflow from" menu.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Apply pending database migrations
        run: npx --no-install supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --yes

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel builds this deployment itself, so the project's environment
      # variables are injected natively (Secret-type values included).
      - name: Deploy to production on Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
